<!doctype html>
<!-- 設計依據：使用者提供的「我的天文台」完整儀表板；深藍雨景、緊湊觀測資料與九日溫度走勢。 -->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港天文台・完整天氣儀表板</title><style>
:root{--ink:#07131d;--card:rgba(8,18,28,.68);--line:rgba(224,240,249,.27);--text:#f4f8fb;--muted:#c7d3db;--orange:#ffab38;--red:#ff5e58;--green:#6de0a6}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:"Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;color:var(--text);font-variant-numeric:tabular-nums;background:#07131d}.rain{position:fixed;inset:0;background:radial-gradient(circle at 77% 16%,rgba(122,152,170,.35),transparent 24%),radial-gradient(circle at 18% 5%,rgba(114,151,175,.28),transparent 22%),linear-gradient(140deg,#324c60 0%,#152b3b 40%,#07121b 78%)}.rain:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(108deg,transparent 0 26px,rgba(218,241,250,.14) 27px 28px,transparent 29px 63px);opacity:.45;animation:fall 1.1s linear infinite}.rain:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,10,15,.15),rgba(4,10,15,.7));}@keyframes fall{to{background-position:100px 180px}}.app{position:relative;z-index:1;width:100vw;height:100vh;padding:clamp(13px,1.6vh,26px) clamp(20px,2.8vw,52px);display:grid;grid-template-rows:auto minmax(155px,24vh) auto minmax(60px,9vh) minmax(160px,23vh) minmax(90px,1fr) auto;gap:clamp(8px,1.2vh,15px)}.top{position:relative;display:flex;justify-content:center;align-items:center;text-align:center}.clock{position:absolute;right:0}.name{font-size:clamp(16px,1.45vw,24px);font-weight:800;letter-spacing:.04em}.source{font-size:clamp(10px,.75vw,13px);color:var(--muted);margin-top:2px}.clock{font-size:clamp(20px,2vw,34px);font-weight:500}.current{min-height:clamp(160px,24vh,300px);display:grid;grid-template-columns:1.1fr .72fr 1fr;align-items:center;text-align:center;padding:clamp(16px,2vw,34px);background:var(--card);border:1px solid var(--line);border-radius:9px;backdrop-filter:blur(9px)}.temp{font-size:clamp(73px,8vw,138px);font-weight:330;line-height:.75;letter-spacing:-.08em}.temp sup{font-size:.38em;vertical-align:top;letter-spacing:-.04em}.place{margin-top:clamp(14px,2vh,24px);font-size:clamp(23px,2.15vw,35px);font-weight:700}.minor{margin-top:7px;font-size:clamp(13px,1.12vw,18px);color:var(--muted);font-weight:600}.art{width:clamp(96px,11vw,175px);color:var(--orange);justify-self:center}.art svg{width:100%;height:100%;display:block;overflow:visible;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 11px rgba(255,171,56,.25))}.details{display:grid;gap:clamp(11px,1.4vh,18px);justify-self:center;width:min(100%,520px)}.stat{display:flex;justify-content:center;gap:10px;align-items:center;color:var(--text);font-size:clamp(18px,1.7vw,28px);font-weight:700}.stat svg{width:19px;height:19px;fill:none;stroke:var(--muted);stroke-width:1.8}.alertbar{display:none;grid-template-columns:auto auto;justify-content:center;align-items:center;gap:13px;padding:clamp(9px,1.1vh,14px) clamp(12px,1.4vw,22px);background:rgba(83,19,17,.8);border:1px solid rgba(255,116,108,.76);border-left:5px solid var(--red);border-radius:5px}.alertbar.show{display:grid}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{width:clamp(28px,2.1vw,38px);height:clamp(28px,2.1vw,38px);display:grid;place-items:center;background:#fff;color:var(--red);border-radius:4px;box-shadow:0 1px 7px rgba(0,0,0,.25)}.warnlogo{width:88%;height:88%;fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.alerttext{font-size:clamp(15px,1.3vw,21px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.forecasttext{height:100%;text-align:center;padding:clamp(9px,1.05vh,14px) clamp(14px,1.8vw,28px);background:rgba(4,13,21,.67);border:1px solid var(--line);border-radius:6px;font-size:clamp(11px,.9vw,15px);line-height:1.28;overflow:hidden}.forecasttext span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.forecasttext #outlook{display:none}.forecasttext b{display:block;margin-bottom:3px;font-size:clamp(13px,1.05vw,17px)}.days{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);background:rgba(4,13,21,.68);min-height:clamp(150px,23vh,220px);overflow:hidden}.day{padding:clamp(10px,1.25vw,19px);border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto auto auto;align-content:space-between;justify-items:center;text-align:center;gap:5px;min-width:0}.day:last-child{border:0}.date{font-size:clamp(15px,1.25vw,20px);font-weight:800}.dayicon{width:clamp(43px,4.1vw,66px);color:var(--orange);align-self:center}.dayicon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.daytemp{font-size:clamp(15px,1.25vw,20px);font-weight:750;white-space:nowrap}.rh{font-size:clamp(14px,1.12vw,18px);color:#e3edf3;font-weight:800;padding-bottom:clamp(3px,.45vh,7px)}.chart{position:relative;min-height:0;background:rgba(4,13,21,.73);border:1px solid var(--line);padding:clamp(12px,1.2vw,20px)}.charthead{display:flex;justify-content:center;align-items:center;margin-bottom:4px;text-align:center}.charthead span{position:absolute;right:clamp(12px,1.2vw,20px)}.charthead b{font-size:clamp(13px,1.15vw,19px)}.charthead span{color:var(--muted);font-size:clamp(9px,.72vw,12px)}.chartsvg{width:100%;height:calc(100% - 28px);display:block;overflow:visible}.footer{font-size:clamp(9px,.67vw,11px);color:rgba(239,247,252,.75);text-align:right}@media(max-width:1050px){.app{padding:10px 18px;gap:7px}.current{min-height:143px;padding:14px 20px}.temp{font-size:68px}.days{min-height:145px}.day{padding:7px}.forecasttext{padding:8px 13px;max-height:59px}.chart{padding:9px 13px}}@media(max-width:750px){.details{gap:4px}.current{grid-template-columns:1fr .65fr 1fr}.days{grid-template-columns:repeat(5,1fr);overflow:hidden}.day:nth-child(n+6){display:none}.chart{display:none}.app{grid-template-rows:auto minmax(140px,24vh) auto minmax(55px,9vh) auto auto auto}.forecasttext{max-height:70px;overflow:hidden}}
</style></head><body><div class="rain"></div><main class="app"><header class="top"><div><div class="name">香港天文台</div><div class="source">香港天文台官方開放資料・自動更新</div></div><time id="clock" class="clock">--:--</time></header><section class="current"><div><div id="temp" class="temp">--<sup>°C</sup></div><div class="place">香港天文台</div><div id="condition" class="minor">讀取即時觀測…</div></div><div id="art" class="art"></div><div class="details"><div class="stat"><svg viewBox="0 0 24 24"><path d="M12 3C8 8 6 11 6 14a6 6 0 0 0 12 0c0-3-2-6-6-11Z"/></svg><span id="humidity">--%</span></div><div class="stat"><svg viewBox="0 0 24 24"><path d="M3 12h12M9 7l6 5-6 5M4 17h10"/></svg><span id="wind">--</span></div><div class="stat"><svg viewBox="0 0 24 24"><path d="M4 17h16M7 14h10M10 11h4"/></svg><span id="rainfall">元朗 -- mm</span></div></div></section><section id="alertbar" class="alertbar"><div id="badges" class="badges"></div><div id="alerttext" class="alerttext"></div></section><section class="forecasttext"><b id="period">本港地區天氣預測</b><span id="description">讀取天氣預測…</span><span id="outlook"></span></section><section id="days" class="days"></section><section class="chart"><div class="charthead"><b>五日氣溫趨勢</b><span>高／低溫預報（°C）</span></div><svg id="chart" class="chartsvg" viewBox="0 0 1000 180" preserveAspectRatio="none"></svg></section><footer id="updated" class="footer">資料更新：--</footer></main><script>
(()=>{const A={r:'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc',f:'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc',l:'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc',w:'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc'};const $=x=>document.getElementById(x),clean=x=>(x||'').replace(/\s+/g,' ').trim(),pad=x=>String(x).padStart(2,'0'),get=(a,p)=>a?.find(x=>x.place===p)?.value;const now=()=>{let d=new Date();$('clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`};function icon(n){let storm=[61,63,65].includes(n),rain=[62,63,64,65].includes(n),sun=[50,51,52,53].includes(n);let p=storm?'<path d="M15 26h29a13 13 0 0 0 0-26 17 17 0 0 0-31 9A10 10 0 0 0 15 26Z"/><path d="m29 31-6 12h9l-5 12 18-21H34l6-10"/>':rain?'<path d="M15 24h29a13 13 0 0 0 0-26 17 17 0 0 0-31 9A10 10 0 0 0 15 24Z"/><path d="m20 33-4 11m17-11-4 11m17-11-4 11"/>':sun?'<circle cx="35" cy="29" r="12"/><path d="M35 5v7m0 34v7M11 29h7m34 0h7M18 12l5 5m24 24 5 5m0-34-5 5M23 41l-5 5"/>':'<path d="M15 26h29a13 13 0 0 0 0-26 17 17 0 0 0-31 9A10 10 0 0 0 15 26Z"/>';return `<svg viewBox="0 -12 64 82" preserveAspectRatio="xMidYMid meet">${p}</svg>`}function label(d){return `${+d.forecastDate.slice(4,6)}月${+d.forecastDate.slice(6,8)}日`}function warningLogo(code){let mark=code==='WTS'?'<path d="M28 8 7 48h18l-3 18 27-39H31l5-19Z"/>':code.startsWith('TC')?'<path d="M32 8a24 24 0 1 0 20 36M32 19a13 13 0 1 0 11 20M32 28a4 4 0 1 0 4 4"/>':code.includes('RAIN')?'<path d="M15 18h34a14 14 0 0 1 0 28H15a14 14 0 0 1 0-28Z"/><path d="m22 52-3 9m15-9-3 9m15-9-3 9"/>':'<path d="M32 7 58 17v18c0 15-10 25-26 31C16 60 6 50 6 35V17L32 7Z"/><path d="M32 22v18m0 10h.1"/>';return `<svg class="warnlogo" viewBox="0 0 64 72" aria-label="${code}">${mark}</svg>`}function draw(days){let vals=days.flatMap(d=>[d.forecastMintemp.value,d.forecastMaxtemp.value]),lo=Math.min(...vals)-1,hi=Math.max(...vals)+1,w=1000,h=180,x=i=>45+i*(910/(days.length-1)),y=v=>145-(v-lo)/(hi-lo)*118;let grid=[lo,Math.round((lo+hi)/2),hi].map(v=>`<line x1="40" x2="965" y1="${y(v)}" y2="${y(v)}" stroke="rgba(230,242,250,.22)"/><text x="5" y="${y(v)+4}" fill="rgba(235,245,250,.8)" font-size="12">${v}°</text>`).join('');let path=a=>a.map((d,i)=>`${i?'L':'M'}${x(i)} ${y(d)}`).join(''),mins=days.map(d=>d.forecastMintemp.value),maxs=days.map(d=>d.forecastMaxtemp.value),dots=(a,c)=>a.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${c}"/><text x="${x(i)}" y="${y(v)+(c==='#ffb33d'?-9:18)}" text-anchor="middle" fill="#f5f9fb" font-size="13">${v}°</text><text x="${x(i)}" y="174" text-anchor="middle" fill="rgba(235,245,250,.8)" font-size="11">${label(days[i])}</text>`).join('');$('chart').innerHTML=grid+`<path d="${path(maxs)}" fill="none" stroke="#ffb33d" stroke-width="3"/><path d="${path(mins)}" fill="none" stroke="#79c8ee" stroke-width="3"/>`+dots(maxs,'#ffb33d')+dots(mins,'#79c8ee')}function render(r,f,l,w){let days=f.weatherForecast||[],temp=get(r.temperature?.data,'香港天文台'),hum=get(r.humidity?.data,'香港天文台'),rain=get(r.rainfall?.data,'元朗');$('temp').innerHTML=`${temp??'--'}<sup>°C</sup>`;$('humidity').textContent=`相對濕度 ${hum??'--'}%`;$('rainfall').textContent=`元朗雨量 ${rain??'--'} mm`;$('wind').textContent=days[0]?.forecastWind||'風力資料暫未有';$('art').innerHTML=icon(r.icon?.[0]);$('condition').textContent=Object.keys(w||{}).length?'請留意現正生效的天氣警告':'本港即時天氣觀測';$('period').textContent=l.forecastPeriod||'本港地區天氣預測';$('description').textContent=clean(l.forecastDesc)||'暫未有文字預報';$('outlook').textContent=l.outlook?`　展望：${clean(l.outlook)}`:'';days=days.slice(0,5);$('days').innerHTML=days.map(d=>`<article class="day"><div class="date">${label(d)}</div><div class="dayicon">${icon(d.ForecastIcon)}</div><div class="daytemp">${d.forecastMintemp.value}°C - ${d.forecastMaxtemp.value}°C</div><div class="rh">${d.forecastMinrh.value}% - ${d.forecastMaxrh.value}%</div></article>`).join('');draw(days);let es=Object.values(w||{}),bar=$('alertbar');if(es.length){bar.classList.add('show');$('badges').innerHTML=es.map(a=>`<span class="badge" title="${a.name}">${warningLogo(a.code)}</span>`).join('');$('alerttext').textContent=es.map(a=>`${a.name}${a.expireTime?'（有效至 '+new Date(a.expireTime).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false})+'）':''}`).join('　')}else bar.classList.remove('show');$('updated').textContent=`資料更新：${r.updateTime?new Date(r.updateTime).toLocaleString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false}):'--'} ・香港天文台官方開放資料`}async function load(){try{let rs=await Promise.all(Object.values(A).map(u=>fetch(u,{cache:'no-store'})));if(rs.some(x=>!x.ok))throw 0;render(...await Promise.all(rs.map(x=>x.json())))}catch(e){$('description').textContent='暫時未能讀取香港天文台資料，系統將自動重試。'}}now();setInterval(now,1000);load();setInterval(load,300000)})();
</script></body></html>
